name: Deploy to GitHub Pages

# Builds the two static pages from src/content.js and publishes them.
#
# Only index.html, en/index.html and assets/ are staged into the artifact.
# video-brief/ and src/stills/ are build *inputs* (~75 MB of raw renders and
# PNG originals) — shipping them would bloat every deploy for no benefit.
#
# workflow_dispatch is kept because a push made with a `gh` OAuth token does
# not always raise a push event; dispatching is the reliable manual fallback:
#     gh workflow run deploy.yml --ref main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: pages
        uses: actions/configure-pages@v5

      # Regenerate the HTML so the deployed page can never drift from the copy
      # source. SITE_URL points canonical/hreflang/og:image at wherever this is
      # actually served; build.js falls back to https://naqla.sy locally.
      - name: Build pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.js

      - name: Stage site
        run: |
          mkdir -p _site/en
          cp index.html _site/index.html
          cp en/index.html _site/en/index.html
          cp -r assets _site/assets
          touch _site/.nojekyll
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
